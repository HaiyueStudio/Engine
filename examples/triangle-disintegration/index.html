<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Haiyue · Triangle Dust Disintegration</title>
  <link rel="stylesheet" href="../example-fullscreen.css" />
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #01040a; color: #eef8ff; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    .panel {
      position: fixed; z-index: 2; top: 20px; left: 20px;
      width: min(390px, calc(100vw - 40px)); padding: 18px;
      border: 1px solid rgba(85, 190, 230, .22); border-radius: 16px;
      background: linear-gradient(145deg, rgba(5, 12, 24, .9), rgba(8, 16, 27, .76));
      box-shadow: 0 26px 80px rgba(0, 0, 0, .48), inset 0 1px rgba(255, 255, 255, .035);
      backdrop-filter: blur(18px);
    }
    .eyebrow { margin: 0 0 7px; color: #66d9ff; font: 700 10px ui-monospace, monospace; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 20px; font-weight: 680; letter-spacing: -.025em; }
    .intro { margin: 9px 0 15px; color: #8fa3b8; font-size: 12px; line-height: 1.65; }
    code { color: #9ce6ff; font: 11px ui-monospace, SFMono-Regular, monospace; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 15px; }
    .metric { padding: 9px 7px; border: 1px solid rgba(72, 123, 153, .18); border-radius: 10px; background: rgba(5, 13, 25, .66); text-align: center; }
    .metric strong { display: block; color: #dff8ff; font: 14px ui-monospace, SFMono-Regular, monospace; }
    .metric span { color: #61788e; font-size: 9px; letter-spacing: .06em; text-transform: uppercase; }
    .timeline { display: grid; grid-template-columns: 1fr 42px; align-items: center; gap: 9px; padding: 12px 0; border-top: 1px solid rgba(92, 127, 150, .16); }
    input[type="range"] { width: 100%; accent-color: #ff6a27; }
    output { color: #ff9a63; text-align: right; font: 11px ui-monospace, monospace; }
    .actions { display: flex; gap: 8px; }
    button { flex: 1; min-height: 34px; padding: 7px 10px; border: 1px solid #263c50; border-radius: 9px; background: #0c1825; color: #dcecf5; cursor: pointer; }
    button:hover, button.active { border-color: #ff7136; background: #2b1712; }
    button.primary { border-color: #ff7b3e; background: linear-gradient(135deg, #ff8a47, #e74420); color: #170703; font-weight: 750; }
    button.primary.active { animation: pulse .7s ease-in-out infinite alternate; }
    .hint { position: fixed; right: 19px; bottom: 17px; color: rgba(174, 207, 224, .48); font-size: 10px; letter-spacing: .03em; }
    #result { display: none; }
    @keyframes pulse { to { box-shadow: 0 0 24px rgba(255, 85, 30, .36); filter: brightness(1.12); } }
    @media (max-width: 680px) { .panel { top: 12px; left: 12px; width: calc(100vw - 24px); padding: 14px; } .hint { display: none; } }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <aside class="panel">
    <p class="eyebrow">Geometry Processing · GPU Vertex Animation</p>
    <h1>Triangle Dust Disintegration</h1>
    <p class="intro"><code>segments = 10</code> 的 indexed box 经 <code>separateGeometryTriangles()</code> 变成互不复用顶点的三角形，再由 GPU 逐片旋转、灰化并生成尘粒拖尾。</p>
    <div class="stats">
      <div class="metric"><strong id="source-vertices">—</strong><span>Indexed vertices</span></div>
      <div class="metric"><strong id="separated-vertices">—</strong><span>Separated vertices</span></div>
      <div class="metric"><strong id="triangle-count">—</strong><span>Triangles</span></div>
    </div>
    <label class="timeline" for="progress"><input id="progress" type="range" min="0" max="1" step="0.001" value="0" /><output id="progress-value">0%</output></label>
    <div class="actions">
      <button id="reset" type="button">复原</button>
      <button id="auto" type="button" class="active" aria-pressed="true">自动重播</button>
      <button id="snap" type="button" class="primary">弹响</button>
    </div>
  </aside>
  <div class="hint">拖拽旋转 · 滚轮缩放 · Space 弹响 · R 复原</div>
  <pre id="result" aria-hidden="true"></pre>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
