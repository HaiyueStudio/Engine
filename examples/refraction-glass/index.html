<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Haiyue · PBR Glass Refraction</title>
  <link rel="stylesheet" href="../example-fullscreen.css" />
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; color: #eef9ff; background: #02050c; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    .panel {
      position: fixed; z-index: 2; top: 18px; left: 18px;
      width: min(338px, calc(100vw - 36px)); padding: 17px;
      border: 1px solid rgba(116, 213, 255, .25); border-radius: 15px;
      background: linear-gradient(145deg, rgba(5, 13, 27, .91), rgba(5, 15, 26, .77));
      box-shadow: 0 24px 72px rgba(0, 0, 0, .48), inset 0 1px rgba(255, 255, 255, .04);
      backdrop-filter: blur(18px);
    }
    .eyebrow { margin: 0 0 6px; color: #6ce4ff; font: 700 10px ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 21px; font-weight: 690; letter-spacing: -.025em; }
    .intro { margin: 8px 0 14px; color: #91a9bd; font-size: 11px; line-height: 1.6; }
    code { color: #a8ebff; font: 10px ui-monospace, monospace; }
    .pipeline { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 5px; margin: 0 0 13px; color: #78a0b8; font: 9px ui-monospace, monospace; text-align: center; }
    .pipeline b { padding: 6px 3px; border: 1px solid rgba(108, 213, 255, .16); border-radius: 6px; color: #c7f4ff; background: rgba(8, 27, 42, .72); font-weight: 600; }
    .control { margin-top: 9px; }
    .line, .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #c4d5e1; font-size: 11px; }
    output { color: #74e1ff; font: 11px ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; margin: 5px 0 0; accent-color: #52cbef; }
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: #45d2f6; }
    .switch { margin-top: 12px; padding-top: 11px; border-top: 1px solid rgba(255, 255, 255, .09); }
    .note { margin: 11px 0 0; color: rgba(194, 219, 233, .49); font-size: 9px; line-height: 1.55; }
    .badge { position: fixed; right: 18px; top: 18px; padding: 8px 11px; border: 1px solid rgba(91, 215, 255, .22); border-radius: 999px; color: #9cecff; background: rgba(3, 13, 23, .72); font: 10px ui-monospace, monospace; backdrop-filter: blur(12px); }
    .hint { position: fixed; right: 18px; bottom: 17px; color: rgba(191, 222, 237, .48); font-size: 10px; }
    #result { display: none; }
    @media (max-width: 700px) { .panel { top: 10px; left: 10px; width: min(310px, calc(100vw - 20px)); padding: 13px; } .badge, .hint { display: none; } }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <aside class="panel">
    <p class="eyebrow">PBR · Scene Color Refraction</p>
    <h1>玻璃球折射</h1>
    <p class="intro">不透明场景先被捕获为只读颜色快照，玻璃材质随后使用 <code>refract()</code>、IOR 与体积厚度弯曲背景。</p>
    <div class="pipeline"><b>Opaque</b><span>→</span><b>Scene snapshot</b><span>→</span><b>Glass</b></div>
    <div class="control">
      <div class="line"><label for="transmission">透射强度</label><output id="transmission-value">1.00</output></div>
      <input id="transmission" type="range" min="0" max="1" step="0.01" value="1" />
    </div>
    <div class="control">
      <div class="line"><label for="ior">折射率 IOR</label><output id="ior-value">1.52</output></div>
      <input id="ior" type="range" min="1" max="2.4" step="0.01" value="1.52" />
    </div>
    <div class="control">
      <div class="line"><label for="thickness">体积厚度</label><output id="thickness-value">1.35</output></div>
      <input id="thickness" type="range" min="0" max="2.4" step="0.01" value="1.35" />
    </div>
    <div class="control">
      <div class="line"><label for="roughness">表面粗糙度</label><output id="roughness-value">0.06</output></div>
      <input id="roughness" type="range" min="0" max="0.65" step="0.01" value="0.06" />
    </div>
    <label class="switch"><span>移动背景参照物</span><input id="animate" type="checkbox" checked /></label>
    <p class="note">当前实现为屏幕空间单层折射：不会递归折射其他透明物体，视口外采样会钳制到边缘。</p>
  </aside>
  <div class="badge">KHR_materials_transmission / volume</div>
  <div class="hint">拖拽旋转 · 滚轮缩放 · 调整厚度观察背景弯曲</div>
  <pre id="result" aria-hidden="true"></pre>
  <script src="../shared/engine.js"></script>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
