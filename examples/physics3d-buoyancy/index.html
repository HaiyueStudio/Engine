<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海月 · 3D 浮力</title>
  <link rel="stylesheet" href="../example-fullscreen.css" />
  <link rel="stylesheet" href="../physics3d-example.css" />
</head>
<body>
  <canvas id="canvas"></canvas>
  <aside class="panel">
    <h1>3D 浮力</h1>
    <p class="intro">Physics3DBuoyancySystem 通过通用力接口施加浮力、线性阻力和角阻力，不依赖具体后端。</p>
    <div class="badges"><span class="badge">buoyancy</span><span class="badge">force at point</span><span class="badge">fluid drag</span></div>
    <label class="row" for="fluid-level"><span>水面高度</span><output id="fluid-level-value">1.2</output></label>
    <input id="fluid-level" type="range" min="0.2" max="2.4" step="0.1" value="1.2" />
    <button id="reset" type="button">重新投放物体</button>
  </aside>
  <div class="hint">拖动空白区域旋转视角 · 滚轮缩放</div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
