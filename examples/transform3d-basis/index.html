<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海月 - Basis Transform3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08090d;
      color: rgba(255,255,255,0.76);
      font-family: monospace;
    }
    canvas { display: block; }
    #hint {
      position: absolute;
      left: 16px;
      bottom: 14px;
      font-size: 12px;
      line-height: 1.6;
      color: rgba(255,255,255,0.46);
      pointer-events: none;
    }
    #readout {
      position: absolute;
      left: 16px;
      top: 14px;
      min-width: 260px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.42);
      border-radius: 6px;
      line-height: 1.65;
      color: rgba(255,255,255,0.72);
    }
  </style>
  <link rel="stylesheet" href="../example-fullscreen.css" />
</head>
<body>
  <canvas id="canvas" width="980" height="640"></canvas>
  <div id="readout"></div>
  <div id="hint">
    red/green/blue lines = basis vectors<br />
    yellow line = mapped position from local coordinates<br />
    drag = orbit, scroll = zoom
  </div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
