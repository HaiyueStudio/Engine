<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haiyue · WebGPU Blur Comparison</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #060912;
      color: #d8e2f2;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    canvas { display: block; }
    .toolbar {
      position: fixed;
      top: 16px;
      left: 50%;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(480px, calc(100vw - 32px));
      padding: 9px 11px;
      border: 1px solid #94a3b833;
      border-radius: 10px;
      background: #0c121ce8;
      backdrop-filter: blur(10px);
      transform: translateX(-50%);
      font-size: 12px;
    }
    button, select, input { font: inherit; }
    button {
      height: 30px;
      padding: 0 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #172033;
      color: #edf4ff;
      cursor: pointer;
    }
    .toolbar span {
      min-width: 0;
      overflow: hidden;
      color: #9fb1c9;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .controls {
      position: fixed;
      top: 70px;
      left: 0;
      right: 0;
      z-index: 3;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 0 18px;
      pointer-events: none;
    }
    .panel {
      width: min(330px, calc(50vw - 28px));
      padding: 13px 14px;
      border: 1px solid #94a3b82d;
      border-radius: 10px;
      background: #09111dde;
      box-shadow: 0 15px 45px #0006;
      backdrop-filter: blur(12px);
      pointer-events: auto;
    }
    .panel:last-child { justify-self: end; }
    .panel h2 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 0 0 10px;
      color: #f3f7ff;
      font-size: 13px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .panel h2 small { color: #72d6c9; font: 11px ui-monospace, monospace; text-transform: none; }
    .control {
      display: grid;
      grid-template-columns: 92px 1fr 42px;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      color: #9fb1c9;
      font-size: 11px;
    }
    .control select { grid-column: 2 / 4; }
    select {
      width: 100%;
      height: 26px;
      border: 1px solid #334155;
      border-radius: 5px;
      background: #111827;
      color: #dce8f7;
    }
    input[type="range"] { width: 100%; accent-color: #42cdbd; }
    output { color: #dbe8f7; font: 10px ui-monospace, monospace; text-align: right; }
    select:disabled, input:disabled { opacity: .36; }
    .labels {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 18px;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      pointer-events: none;
      color: #d8e5f6;
      font-size: 11px;
      text-align: center;
      letter-spacing: .05em;
    }
    .divider {
      position: fixed;
      top: 62px;
      bottom: 52px;
      left: 50%;
      z-index: 2;
      width: 1px;
      background: linear-gradient(transparent, #dcecff66 18%, #dcecff66 82%, transparent);
      pointer-events: none;
    }
    @media (max-width: 760px) {
      .controls { top: 66px; gap: 8px; padding: 0 8px; }
      .panel { width: calc(50vw - 12px); padding: 10px; }
      .control { grid-template-columns: 1fr 36px; gap: 4px; }
      .control > span { grid-column: 1 / 3; }
      .control select { grid-column: 1 / 3; }
      .panel h2 { font-size: 11px; }
    }
  </style>
  <link rel="stylesheet" href="../example-fullscreen.css" />
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="toolbar">
    <button id="upload-button" type="button">Upload Image</button>
    <span id="upload-name">Generated edge-detail texture · 768×512</span>
    <input id="upload-input" type="file" accept="image/*" hidden />
  </div>
  <div class="controls">
    <section class="panel">
      <h2>Left half <small id="left-pass-count">1 pass</small></h2>
      <label class="control"><span>Method</span><select id="left-method">
        <option value="none">No blur</option><option value="convolution">Square convolution</option>
        <option value="gaussian">Separable Gaussian</option><option value="box">Separable Box</option>
        <option value="mipmap">Mipmap blur</option><option value="kawase">Kawase blur</option>
      </select></label>
      <label class="control"><span>Kernel</span><select id="left-kernel-size"><option value="3">3×3</option><option value="5">5×5</option><option value="7">7×7</option></select></label>
      <label class="control"><span>Radius</span><input id="left-radius" type="range" min="1" max="32" step="1" /><output id="left-radius-value"></output></label>
      <label class="control"><span>Levels / iterations</span><input id="left-iterations" type="range" min="1" max="8" step="1" /><output id="left-iterations-value"></output></label>
    </section>
    <section class="panel">
      <h2>Right half <small id="right-pass-count">2 passes</small></h2>
      <label class="control"><span>Method</span><select id="right-method">
        <option value="none">No blur</option><option value="convolution">Square convolution</option>
        <option value="gaussian">Separable Gaussian</option><option value="box">Separable Box</option>
        <option value="mipmap">Mipmap blur</option><option value="kawase">Kawase blur</option>
      </select></label>
      <label class="control"><span>Kernel</span><select id="right-kernel-size"><option value="3">3×3</option><option value="5">5×5</option><option value="7">7×7</option></select></label>
      <label class="control"><span>Radius</span><input id="right-radius" type="range" min="1" max="32" step="1" /><output id="right-radius-value"></output></label>
      <label class="control"><span>Levels / iterations</span><input id="right-iterations" type="range" min="1" max="8" step="1" /><output id="right-iterations-value"></output></label>
    </section>
  </div>
  <div class="divider"></div>
  <div class="labels"><div id="left-label">7×7 Square convolution</div><div id="right-label">Separable Gaussian · radius 14</div></div>
  <script src="../shared/engine.js"></script>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
