<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海月 - glTF Animation3D Cross-fade</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #07101f;
      color: #e6edf7;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .panel {
      position: fixed;
      top: 20px;
      left: 20px;
      width: min(430px, calc(100vw - 40px));
      padding: 18px;
      border: 1px solid rgba(125, 211, 252, 0.24);
      border-radius: 14px;
      background: rgba(7, 16, 31, 0.88);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(14px);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 18px;
      letter-spacing: 0.01em;
    }
    p {
      margin: 0 0 14px;
      color: #9fb1c8;
      font-size: 13px;
      line-height: 1.55;
    }
    .phase {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .phase span {
      padding: 7px 8px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 8px;
      color: #7f91aa;
      text-align: center;
      font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .phase span.active {
      border-color: rgba(34, 211, 238, 0.55);
      background: rgba(8, 145, 178, 0.24);
      color: #cffafe;
    }
    progress {
      width: 100%;
      height: 8px;
      margin-bottom: 13px;
      accent-color: #22d3ee;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    button {
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid rgba(125, 211, 252, 0.3);
      border-radius: 8px;
      background: #10223a;
      color: #e0f2fe;
      cursor: pointer;
      font: inherit;
    }
    button:hover { background: #173452; }
    pre {
      min-height: 92px;
      margin: 0;
      overflow: auto;
      color: #a5f3fc;
      font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
    }
    #result { display: none; }
    .badge {
      display: inline-block;
      margin: 0 4px 4px 0;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(30, 64, 175, 0.28);
      color: #bfdbfe;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <section class="panel">
    <h1>glTF → Animation3D</h1>
    <p>同一个公开 Mixer 在一秒内混合根 TRS、skinning joint 与 GPU morph；采样保留 STEP、LINEAR 和 CUBICSPLINE。</p>
    <div>
      <span class="badge">Animation3DMixer</span>
      <span class="badge">Animation3DPoseBuffer</span>
      <span class="badge">GPU morph</span>
      <span class="badge">skinning</span>
    </div>
    <div class="phase" aria-label="cross-fade phase">
      <span id="phase-idle">IDLE</span>
      <span id="phase-blend">BLEND</span>
      <span id="phase-run">RUN</span>
    </div>
    <progress id="blend-progress" max="1" value="0"></progress>
    <div class="controls">
      <button id="restart" type="button">重播 Idle → Run</button>
      <button id="pause" type="button">暂停</button>
    </div>
    <pre id="status">正在加载真实 glTF characterization fixture…</pre>
  </section>
  <output id="result" aria-hidden="true"></output>
  <script src="../shared/engine.js"></script>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
