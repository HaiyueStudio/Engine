<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海月 – Post-processing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060610;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }
    canvas { display: block; }
    #hud {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }
    #effect-label {
      font-size: 15px;
      color: rgba(255,255,255,0.85);
      background: rgba(0,0,0,0.5);
      padding: 4px 14px;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }
    #keys {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
    }
    #info {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
    }
  </style>
  <link rel="stylesheet" href="../example-fullscreen.css" />
</head>
<body>
  <canvas id="canvas" width="900" height="600"></canvas>
  <div id="hud">
    <div id="effect-label">FXAA</div>
    <div id="keys">1 = none · 2 = FXAA · 3 = blur · 4 = FXAA+blur · 5 = chromatic aberration · 6 = grayscale</div>
  </div>
  <div id="info">left drag = orbit · scroll = zoom</div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
