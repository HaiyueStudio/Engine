<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海月 – Distance & Height Fog</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #7a91ad; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
    canvas { display: block; }
    #panel {
      position: absolute; top: 16px; left: 16px; width: 260px; padding: 14px;
      color: #edf5ff; background: rgba(14, 23, 35, 0.82); border: 1px solid rgba(255,255,255,.16);
      border-radius: 10px; backdrop-filter: blur(12px); box-shadow: 0 12px 32px rgba(0,0,0,.25);
    }
    h1 { margin: 0 0 4px; font-size: 16px; font-weight: 650; }
    .subtitle { margin: 0 0 12px; color: rgba(237,245,255,.58); font-size: 11px; line-height: 1.45; }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    button {
      padding: 7px 9px; color: rgba(237,245,255,.68); background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.14); border-radius: 6px; cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,.1); }
    button.active { color: white; background: rgba(80,155,255,.28); border-color: rgba(105,174,255,.7); }
    #toggle-fog { width: 100%; margin-bottom: 10px; }
    .controls { display: grid; gap: 9px; padding-top: 4px; }
    .controls[hidden] { display: none; }
    label { display: grid; grid-template-columns: 1fr 46px; gap: 7px; align-items: center; font-size: 11px; color: rgba(237,245,255,.68); }
    input[type='range'] { grid-column: 1 / -1; width: 100%; accent-color: #69aeff; }
    output { text-align: right; color: #fff; font-variant-numeric: tabular-nums; }
    .common { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.1); }
    #hint { position: absolute; bottom: 14px; width: 100%; text-align: center; color: rgba(255,255,255,.52); font-size: 11px; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
    body.regression #panel, body.regression #hint { display: none; }
  </style>
  <link rel="stylesheet" href="../example-fullscreen.css" />
</head>
<body>
  <canvas id="canvas" width="1100" height="700"></canvas>
  <aside id="panel">
    <h1>Scene Fog</h1>
    <p class="subtitle">Distance fog uses a strict linear ramp. Height fog integrates exponential density along the camera ray.</p>
    <div class="modes">
      <button id="distance-mode" class="active">1 · Distance</button>
      <button id="height-mode">2 · Height</button>
    </div>
    <button id="toggle-fog" class="active">Fog enabled</button>
    <div id="distance-controls" class="controls">
      <label>Start <output id="distance-start-value"></output><input id="distance-start" type="range" min="0" max="50" step="1" value="8" /></label>
      <label>End <output id="distance-end-value"></output><input id="distance-end" type="range" min="10" max="120" step="1" value="65" /></label>
    </div>
    <div id="height-controls" class="controls" hidden>
      <label>Base height <output id="base-height-value"></output><input id="base-height" type="range" min="-8" max="10" step="0.1" value="0" /></label>
      <label>Density <output id="density-value"></output><input id="density" type="range" min="0" max="0.2" step="0.005" value="0.055" /></label>
      <label>Falloff <output id="height-falloff-value"></output><input id="height-falloff" type="range" min="0" max="1" step="0.01" value="0.28" /></label>
    </div>
    <div class="controls common">
      <label>Max opacity <output id="max-opacity-value"></output><input id="max-opacity" type="range" min="0" max="1" step="0.01" value="1" /></label>
    </div>
  </aside>
  <div id="hint">1 / 2 = fog model · 0 = toggle fog · drag = orbit · scroll = zoom</div>
  <script src="../shared/engine.js"></script>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
