<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海月 – Bitmap Font</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: monospace;
      color: #ccc;
    }
    canvas { display: block; border: 1px solid #222; }

    #controls {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    #controls label { font-size: 12px; color: #aaa; }
    #textInput {
      background: #1a1a2e;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 4px 8px;
      font-family: monospace;
      font-size: 13px;
      width: 280px;
    }
    #hint {
      margin-top: 8px;
      font-size: 11px;
      color: rgba(255,255,255,0.3);
    }
  </style>
  <link rel="stylesheet" href="../example-fullscreen.css" />
</head>
<body>
  <canvas id="canvas" width="900" height="540"></canvas>

  <div id="controls">
    <label for="textInput">Live text:</label>
    <input id="textInput" type="text" value="Hello, WebGPU!" />
  </div>
  <div id="hint">
    Three label rows show normal / SDF / MSDF rendering modes (using the same canvas-generated atlas).
    For crisp SDF/MSDF, generate the atlas with a dedicated tool (e.g. msdf-bmfont-xml).
  </div>

  <script src="../shared/engine.js"></script>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
