<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海月 - Conway's Game of Life</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #05070b;
      color: #e5edf8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      cursor: crosshair;
      touch-action: none;
    }
    .toolbar {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 6px;
      background: rgba(12, 18, 28, 0.86);
      backdrop-filter: blur(8px);
    }
    button {
      height: 30px;
      min-width: 64px;
      padding: 0 12px;
      border: 1px solid #334155;
      border-radius: 5px;
      background: #111827;
      color: #e5edf8;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    button[data-active="true"] {
      border-color: #22c55e;
      background: #11351f;
    }
    .meta {
      min-width: 92px;
      color: #9fb1c9;
      font-size: 12px;
    }
  </style>
  <link rel="stylesheet" href="../example-fullscreen.css" />
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="toolbar">
    <button id="play">Play</button>
    <button id="step">Step</button>
    <button id="random">Random</button>
    <button id="clear">Clear</button>
    <span id="meta" class="meta">Gen 0</span>
  </div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
