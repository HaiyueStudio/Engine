<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海月 – Orbit Control</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a12; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    canvas { display: block; width: 900px; height: 600px; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-family: monospace;
      font-size: 12px;
      color: #888;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
  <link rel="stylesheet" href="../example-fullscreen.css" />
</head>
<body>
  <canvas id="canvas" width="900" height="600"></canvas>
  <div id="hint">Left drag — orbit &nbsp;|&nbsp; Right/mid drag — pan &nbsp;|&nbsp; Scroll — zoom</div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
