<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lottie → HYA Fidelity Compare</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; } * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #050817; color: #edf7ff; display: grid; grid-template-rows: auto 1fr auto; }
    header { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid #1d3152; background: #071023; }
    h1 { margin: 0; font-size: 17px; } .tag { color: #70ead6; font: 800 9px ui-monospace, monospace; letter-spacing: .12em; }
    select, button, input { accent-color: #6ee7d2; } select, button { border: 1px solid #2d5371; border-radius: 7px; background: #10213c; color: #edf7ff; padding: 7px 10px; }
    #status { margin-left: auto; max-width: 45vw; color: #8fa7c5; font-size: 10px; } #status[data-kind=error] { color: #ff8297; }
    main { min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #1a2c4a; }
    .pane { min-width: 0; min-height: 0; position: relative; overflow: hidden; background: radial-gradient(circle, #101c39, #050817 66%); }
    .pane h2 { position: absolute; z-index: 2; top: 12px; left: 14px; margin: 0; padding: 6px 9px; border-radius: 7px; background: rgba(4,9,24,.8); font-size: 11px; }
    canvas, #reference-player { width: 100%; height: 100%; display: block; overflow: hidden; }
    #reference-player svg { width: 100% !important; height: 100% !important; }
    footer { padding: 10px 14px; border-top: 1px solid #1d3152; background: #071023; }
    .transport { display: grid; grid-template-columns: auto minmax(160px,1fr) 100px auto; gap: 10px; align-items: center; }
    .view { display: grid; grid-template-columns: repeat(3, minmax(100px,1fr)) auto 120px; gap: 12px; align-items: center; margin-top: 9px; }
    label { display: grid; grid-template-columns: auto 1fr; gap: 7px; align-items: center; color: #91a7c4; font-size: 10px; } input[type=range] { width: 100%; }
    output { color: #b9cce4; font: 10px ui-monospace, monospace; } #diagnostics { max-height: 38px; overflow: auto; margin-top: 7px; color: #738aa8; font: 9px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
    #result { display: none; } @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } .view { grid-template-columns: 1fr; } #status { display: none; } }
  </style>
</head>
<body>
  <header><span class="tag">FIDELITY LAB</span><h1>Lottie → HYA 对照</h1><select id="sample" aria-label="sample"></select><span id="status">准备中…</span></header>
  <main>
    <section class="pane"><h2>左 · HYA / HaiYue WebGPU</h2><canvas id="hya-canvas" width="800" height="640"></canvas></section>
    <section class="pane"><h2>右 · 官方 lottie-web / SVG</h2><div id="reference-player"></div></section>
  </main>
  <footer>
    <div class="transport"><button id="play" type="button">暂停</button><input id="timeline" type="range" min="0" max="1" step="0.001" value="0" /><output id="time">0.00s</output><button id="fit" type="button">重新适配</button></div>
    <div class="view"><label>缩放<input id="zoom" type="range" min="0.25" max="3" step="0.01" value="1" /></label><label>水平<input id="pan-x" type="range" min="-600" max="600" step="1" value="0" /></label><label>垂直<input id="pan-y" type="range" min="-400" max="400" step="1" value="0" /></label><output id="view-value">1.00×</output><span></span></div>
    <div id="diagnostics">等待转换</div>
  </footer>
  <pre id="result"></pre><script type="module" src="./bundle.js"></script>
</body>
</html>
