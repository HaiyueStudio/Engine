<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海月 – Interactive (Raycasting)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    canvas { display: block; width: 900px; height: 600px; cursor: default; }
    #legend {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      font-family: monospace;
      font-size: 12px;
      color: #ccc;
    }
    .leg { display: flex; align-items: center; gap: 6px; }
    .swatch { width: 14px; height: 14px; border-radius: 2px; }
    #log {
      position: fixed;
      top: 12px;
      left: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #aef;
      background: rgba(0,0,0,0.6);
      padding: 8px 12px;
      border-radius: 4px;
      max-width: 340px;
      line-height: 1.7;
      pointer-events: none;
    }
  </style>
  <link rel="stylesheet" href="../example-fullscreen.css" />
</head>
<body>
  <canvas id="canvas" width="900" height="600"></canvas>

  <div id="log">Hover / click the boxes…</div>

  <div id="legend">
    <div class="leg"><div class="swatch" style="background:#e84040"></div>Red – Interactive</div>
    <div class="leg"><div class="swatch" style="background:#40c040"></div>Green – Interactive</div>
    <div class="leg"><div class="swatch" style="background:#4070f0"></div>Blue – Interactive</div>
    <div class="leg"><div class="swatch" style="background:#888"></div>Grey – Occluder (no Interactive)</div>
    <div class="leg"><div class="swatch" style="background:#f0d020"></div>Yellow – Penetrable (Interactive passthrough)</div>
  </div>

  <script src="../shared/engine.js"></script>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
