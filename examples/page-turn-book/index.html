<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Haiyue Engine · PDF Page-Turn Reader</title>
  <link rel="stylesheet" href="../example-fullscreen.css" />
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #0d1117; }
    #canvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
    .panel {
      position: fixed;
      left: 22px;
      top: 22px;
      width: min(340px, calc(100vw - 44px));
      padding: 18px 20px;
      border: 1px solid rgba(255, 235, 202, .2);
      border-radius: 16px;
      background: rgba(18, 20, 24, .78);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
      backdrop-filter: blur(16px);
      pointer-events: none;
    }
    .eyebrow { color: #d9ad76; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 7px 0 8px; color: #f6eee2; font: 650 24px/1.15 Georgia, serif; }
    #status { min-height: 20px; color: #b8c0ca; font-size: 13px; line-height: 1.55; }
    .meta { display: flex; justify-content: space-between; margin-top: 15px; color: #e5d8c8; font-size: 12px; }
    progress { width: 100%; height: 5px; margin-top: 9px; border: 0; border-radius: 8px; overflow: hidden; appearance: none; }
    progress::-webkit-progress-bar { background: rgba(255,255,255,.1); }
    progress::-webkit-progress-value { background: linear-gradient(90deg, #9c4d3e, #dbb06c); }
    .controls {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 9px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(20, 22, 26, .82);
      backdrop-filter: blur(14px);
    }
    button {
      min-width: 118px;
      border: 0;
      border-radius: 999px;
      padding: 11px 18px;
      color: #f8eee3;
      background: #733042;
      font: 700 13px system-ui, sans-serif;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #95465a; }
    button:disabled { cursor: default; opacity: .35; }
    #open-pdf { background: #304e64; }
    #open-pdf:hover:not(:disabled) { background: #3e6d89; }
    .hint { color: #9ba3ad; padding: 0 7px; font-size: 11px; white-space: nowrap; }
    @media (max-width: 680px) {
      .panel { left: 12px; top: 12px; padding: 14px 16px; }
      .hint { display: none; }
      .controls { bottom: 14px; }
      button { min-width: 102px; }
    }
  </style>
</head>
<body data-render-status="loading">
  <canvas id="canvas"></canvas>
  <section class="panel" aria-live="polite">
    <div class="eyebrow">PDF.js · lazy page textures</div>
    <h1>PDF page-turn reader</h1>
    <div id="status">Preparing PDF document…</div>
    <div class="meta"><span id="document-label">ai.pdf</span><span id="cache-label">0 / 6 textures</span></div>
    <div class="meta"><span id="page-label">Loading</span><span>48 × 12 segments</span></div>
    <progress id="turn-progress" max="1" value="0"></progress>
  </section>
  <nav class="controls" aria-label="Book navigation">
    <button id="open-pdf" type="button">Open PDF</button>
    <input id="pdf-file" type="file" accept="application/pdf,.pdf" hidden />
    <button id="previous" type="button">← Previous</button>
    <span class="hint">Drag empty space to orbit · Right-drag to pan · Scroll to zoom</span>
    <button id="next" type="button">Next →</button>
  </nav>
  <!-- Keep long-running example servers from reusing the pre-fix paper-stack bundle. -->
  <script src="../shared/engine.js"></script>
  <script type="module" src="./bundle.js?v=paper-stack-scene-removal"></script>
</body>
</html>
