<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海月 – Blending</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }
    canvas { display: block; }
    #info {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
    }
    #labels {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      pointer-events: none;
    }
    #labels span {
      font-family: monospace;
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      background: rgba(0,0,0,0.4);
      padding: 3px 10px;
      border-radius: 4px;
    }
  </style>
  <link rel="stylesheet" href="../example-fullscreen.css" />
</head>
<body>
  <canvas id="canvas" width="900" height="600"></canvas>
  <div id="labels">
    <span>Opaque</span>
    <span>Normal blend (alpha)</span>
    <span>Additive blend</span>
  </div>
  <div id="info">left drag = orbit · scroll = zoom</div>
  <script src="../shared/engine.js"></script>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
