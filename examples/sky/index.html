<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海月 - Sky</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #05070b;
      font-family: monospace;
    }
    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #panel {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 280px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(9, 13, 18, 0.72);
      color: rgba(255,255,255,0.86);
      backdrop-filter: blur(8px);
    }
    .row {
      display: grid;
      grid-template-columns: 112px 1fr 42px;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      font-size: 12px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #63b3ff;
    }
    .value {
      color: rgba(255,255,255,0.58);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    #hint {
      position: absolute;
      left: 16px;
      bottom: 14px;
      color: rgba(255,255,255,0.44);
      font-size: 11px;
    }
  </style>
  <link rel="stylesheet" href="../example-fullscreen.css" />
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="panel">
    <div class="row">
      <label for="turbidity">Turbidity</label>
      <input id="turbidity" type="range" min="0" max="20" step="0.1" value="10" />
      <span class="value" id="turbidity-value">10.0</span>
    </div>
    <div class="row">
      <label for="rayleigh">Rayleigh</label>
      <input id="rayleigh" type="range" min="0" max="6" step="0.1" value="3" />
      <span class="value" id="rayleigh-value">3.0</span>
    </div>
    <div class="row">
      <label for="mie">Mie Coef</label>
      <input id="mie" type="range" min="0" max="0.05" step="0.001" value="0.005" />
      <span class="value" id="mie-value">0.005</span>
    </div>
    <div class="row">
      <label for="mie-g">Mie G</label>
      <input id="mie-g" type="range" min="0" max="0.98" step="0.01" value="0.7" />
      <span class="value" id="mie-g-value">0.70</span>
    </div>
    <div class="row">
      <label for="elevation">Elevation</label>
      <input id="elevation" type="range" min="-8" max="80" step="0.1" value="12" />
      <span class="value" id="elevation-value">12.0</span>
    </div>
    <div class="row">
      <label for="azimuth">Azimuth</label>
      <input id="azimuth" type="range" min="-180" max="180" step="1" value="160" />
      <span class="value" id="azimuth-value">160</span>
    </div>
    <div class="row">
      <label for="exposure">Exposure</label>
      <input id="exposure" type="range" min="0" max="2" step="0.01" value="0.65" />
      <span class="value" id="exposure-value">0.65</span>
    </div>
  </div>
  <div id="hint">left drag = orbit &nbsp;·&nbsp; scroll = zoom</div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
