<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海月 - GUI Component Playground</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #060b16; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #status { position: absolute; left: 24px; top: 24px; max-width: calc(100% - 48px); color: #cbd5e1; font: 14px/1.6 sans-serif; }
    #status[data-state="error"] { color: #fda4af; }
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="Engine GUI component playground"></canvas>
  <div id="status" role="status">Starting WebGPU GUI playground...</div>
  <script src="../shared/engine.js"></script>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
