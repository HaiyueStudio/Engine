<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海月 - GUI Runtime</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #wrap {
      position: relative;
      width: 900px;
      height: 560px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: #020617;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: default;
    }
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      padding: 24px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
    }
    .panel {
      width: min(320px, calc(100vw - 48px));
      padding: 16px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: rgba(15, 23, 42, 0.82);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 600;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 6px 0;
    }
    .hint {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
  <link rel="stylesheet" href="../example-fullscreen.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <div class="panel">
        <h1>GUI Runtime Phase 3</h1>
        <div class="row"><span>Button clicks</span><strong id="clicks">0</strong></div>
        <div class="row"><span>Checkbox</span><strong id="checkbox">false</strong></div>
        <div class="row"><span>Switch</span><strong id="switch">false</strong></div>
        <div class="row"><span>Slider</span><strong id="slider">25</strong></div>
        <div class="row"><span>Input</span><strong id="input">hello</strong></div>
        <div class="row"><span>Radio</span><strong id="radio">small</strong></div>
        <div class="row"><span>Select</span><strong id="select">tetris</strong></div>
        <div class="row"><span>Tree</span><strong id="tree">Tetris</strong></div>
        <div class="row"><span>Focused</span><strong id="focus">none</strong></div>
        <div class="row"><span>Hovered</span><strong id="hover">none</strong></div>
        <div class="hint">Controls below are rendered by the engine GUI shape/text batches.</div>
      </div>
    </div>
  </div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
