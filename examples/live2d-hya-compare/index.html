<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Live2D → HYA Fidelity Compare</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; } * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #050817; color: #edf7ff; display: grid; grid-template-rows: auto 1fr auto; }
    header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #1d3152; background: #071023; }
    h1 { margin: 0; font-size: 17px; } .tag { color: #70ead6; font: 800 9px ui-monospace, monospace; letter-spacing: .12em; }
    button, input[type=text], select { border: 1px solid #2d5371; border-radius: 7px; background: #10213c; color: #edf7ff; padding: 7px 10px; } button { cursor: pointer; }
    .core { display: flex; gap: 7px; align-items: center; } #core-url { width: min(360px,30vw); font: 9px ui-monospace,monospace; }
    .motion-picker { display: flex; align-items: center; gap: 6px; color: #91a7c4; font-size: 10px; } #motion-select { min-width: 190px; max-width: 260px; } #motion-select:disabled { opacity: .55; }
    #status { margin-left: auto; max-width: 38vw; color: #8fa7c5; font-size: 10px; } #status[data-kind=error] { color: #ff8297; } #status[data-kind=warning] { color: #ffd17c; }
    main { min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #1a2c4a; }
    .pane { min-width: 0; min-height: 0; position: relative; overflow: hidden; background: #050817; }
    .pane h2 { position: absolute; z-index: 2; top: 12px; left: 14px; margin: 0; padding: 6px 9px; border-radius: 7px; background: rgba(4,9,24,.8); font-size: 11px; }
    canvas { width: 100%; height: 100%; display: block; background: #050817; }
    footer { padding: 10px 14px; border-top: 1px solid #1d3152; background: #071023; }
    .transport { display: grid; grid-template-columns: auto minmax(160px,1fr) 110px auto; gap: 10px; align-items: center; }
    .view { display: grid; grid-template-columns: repeat(3,minmax(100px,1fr)) auto 130px; gap: 12px; align-items: center; margin-top: 9px; }
    label { display: grid; grid-template-columns: auto 1fr; gap: 7px; align-items: center; color: #91a7c4; font-size: 10px; } input[type=range] { width: 100%; accent-color: #6ee7d2; }
    output { color: #b9cce4; font: 10px ui-monospace,monospace; } .notice { font-size: 9px; color: #657d9c; } #result, #model-directory { display: none; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } #status,.core input { display: none; } .view { grid-template-columns: 1fr; } #motion-select { min-width: 140px; max-width: 45vw; } }
  </style>
</head>
<body>
  <header>
    <span class="tag">LICENSED FIDELITY LAB</span><h1>Live2D → HYA 对照</h1>
    <button id="bundled" type="button">MIT Capture Sample</button>
    <div class="core"><input id="core-url" type="text" value="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js" aria-label="Cubism Core URL" /><button id="choose-model" type="button">选择已获许可模型目录</button><input id="model-directory" type="file" webkitdirectory multiple /></div>
    <label class="motion-picker">动作<select id="motion-select" aria-label="Live2D 动作" disabled><option>正在读取动作…</option></select></label>
    <span id="status">准备中…</span>
  </header>
  <main>
    <section class="pane"><h2>左 · HYA / HaiYue WebGPU · <span id="runtime-state">loading</span></h2><canvas id="hya-canvas" width="800" height="640"></canvas></section>
    <section class="pane"><h2>右 · <span id="reference-mode">Capture mesh reference</span></h2><canvas id="reference-canvas" width="800" height="640"></canvas></section>
  </main>
  <footer>
    <div class="transport"><button id="play" type="button">暂停</button><input id="timeline" type="range" min="0" max="2" step="0.001" value="0" /><output id="time">0.00s</output><button id="fit" type="button">重新适配</button></div>
    <div class="view"><label>缩放<input id="zoom" type="range" min="0.05" max="8" step="0.01" value="1" /></label><label>水平<input id="pan-x" type="range" min="-600" max="600" step="1" value="0" /></label><label>垂直<input id="pan-y" type="range" min="-400" max="400" step="1" value="0" /></label><output id="view-value">1.00×</output><span class="notice">Core 与官方模型不随仓库分发；本地加载即表示调用方已处理相应许可。</span></div>
  </footer>
  <pre id="result"></pre><script src="../shared/engine.js"></script><script type="module" src="./bundle.js"></script>
</body>
</html>
