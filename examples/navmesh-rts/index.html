<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Haiyue NavMesh RTS</title>
  <link rel="stylesheet" href="../example-fullscreen.css" />
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #091016; color: #eaf7f5; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
    .panel { position: fixed; z-index: 2; top: 16px; left: 16px; width: min(370px, calc(100vw - 32px)); padding: 16px; border: 1px solid rgba(100,229,199,.25); border-radius: 14px; background: rgba(7,15,22,.86); box-shadow: 0 24px 70px rgba(0,0,0,.42); backdrop-filter: blur(16px); }
    h1 { margin: 0 0 6px; font-size: 17px; letter-spacing: .01em; }
    .intro { margin: 0 0 13px; color: #91a8ad; font-size: 11px; line-height: 1.6; }
    .agents { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { padding: 9px 10px; border: 1px solid #29434a; border-radius: 9px; background: #10242a; color: #dff7f1; cursor: pointer; text-align: left; }
    button:hover, button.active { border-color: #67e2c6; background: #173a3d; box-shadow: inset 0 0 0 1px rgba(103,226,198,.18); }
    button strong { display: block; font-size: 12px; } button span { color: #78949a; font-size: 9px; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 12px; }
    .metric { padding: 8px; border-radius: 8px; background: rgba(13,29,35,.85); text-align: center; }
    .metric strong { display: block; color: #73e8cf; font: 12px ui-monospace, SFMono-Regular, monospace; }
    .metric span { color: #658087; font-size: 8px; text-transform: uppercase; letter-spacing: .08em; }
    .status { margin-top: 10px; min-height: 35px; padding: 9px 10px; border-left: 2px solid #65dfc4; background: rgba(10,25,30,.75); color: #b7cbc9; font-size: 10px; line-height: 1.55; }
    .legend { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 10px; color: #789096; font-size: 9px; }
    .legend i { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; }
    .blue { background: #36a9ff; } .green { background: #51e395; } .amber { background: #ffad45; } .cyan { background: #4de2d1; }
    .hint { position: fixed; right: 16px; bottom: 14px; color: rgba(214,235,231,.55); font-size: 10px; }
    #result { display: none; }
    @media (max-width: 720px) { .panel { top: 10px; left: 10px; width: calc(100vw - 20px); } .hint { display: none; } }
  </style>
</head>
<body>
  <canvas id="canvas" width="1200" height="760"></canvas>
  <aside class="panel">
    <h1>NavMesh · RTS Agent Navigation</h1>
    <p class="intro">点击球体选择代理，再点击地形下达移动命令。陡坡不会进入 NavMesh；大球会绕行宽坡，小球能穿过狭窄坡道。不可达点击会自动落到最近可达点。</p>
    <div class="agents">
      <button id="select-large" class="active" type="button"><strong>Large agent · R 0.72</strong><span>需要宽通道</span></button>
      <button id="select-small" type="button"><strong>Small agent · R 0.30</strong><span>可通过窄坡道</span></button>
    </div>
    <div class="metrics">
      <div class="metric"><strong id="agent">LARGE</strong><span>Selected</span></div>
      <div class="metric"><strong id="path-status">IDLE</strong><span>Path</span></div>
      <div class="metric"><strong id="visited">0</strong><span>A* nodes</span></div>
    </div>
    <div id="status" class="status">选择大球或小球，然后点击地形。</div>
    <div class="legend"><span><i class="blue"></i>大球</span><span><i class="green"></i>小球</span><span><i class="amber"></i>动态障碍</span><span><i class="cyan"></i>NavMesh 边界</span></div>
  </aside>
  <div class="hint">单击：选择 / 移动 · 拖拽：旋转相机 · 滚轮：缩放</div>
  <pre id="result" aria-hidden="true"></pre>
  <script src="../shared/engine.js"></script>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
