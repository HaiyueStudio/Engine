<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haiyue · Share content</title>
<style>body{margin:0;background:#0b1424;color:#edf5ff;font:16px system-ui}main{max-width:1240px;margin:32px auto;padding:0 24px}h1{margin-bottom:8px}p{color:#b8cada;line-height:1.7}.layout{display:grid;grid-template-columns:320px 1fr;gap:24px}canvas{width:320px;height:320px;display:block;background:#15253d}img{display:block;width:100%;max-height:650px;object-fit:contain;object-position:top left}button,select{padding:11px 14px;margin:6px 6px 6px 0;border:1px solid #45627d;border-radius:6px;background:#233e59;color:white}button:disabled{opacity:.4}textarea{width:100%;box-sizing:border-box;background:#14263d;color:#d7eaff;border:1px solid #34506d;padding:12px;margin-top:12px;resize:vertical}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#93d9ba;font-size:13px}#error{color:#ff9f9f}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:0 16px}canvas{max-width:100%}}</style></head><body><main>
<h1>战绩分享内容</h1><p>从引擎的实际 GPU 画面截图，生成中英文战绩卡与同题挑战链接。</p>
<div><select id="locale" aria-label="语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select><select id="layout" aria-label="卡片方向"><option value="landscape">横版 1200 × 630</option><option value="portrait">竖版 900 × 1200</option></select><button id="generate">重新生成</button><button id="download" disabled>下载战绩卡</button><button id="share" disabled>系统分享</button></div>
<div class="layout"><section><h2>引擎画面</h2><canvas id="canvas" aria-label="GPU GUI 数独演示棋盘"></canvas><p>固定演示战绩；展示截图和排版流程，不包含数独生成器。</p></section><section><h2>生成的分享图片</h2><img id="preview" alt="生成的数独战绩分享卡"><textarea id="copy" rows="3" aria-label="分享文案" readonly></textarea><textarea id="link" rows="3" aria-label="挑战链接" readonly></textarea><pre id="status" aria-live="polite"></pre></section></div>
<pre id="error"></pre><pre id="result"></pre></main><script src="../shared/engine.js"></script><script type="module" src="./bundle.js"></script></body></html>
