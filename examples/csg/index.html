<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海月 - CSG Boolean Geometry</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #071018;
      color: #d8e2f2;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas { display: block; }
    .panel {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 2;
      width: min(260px, calc(100vw - 32px));
      padding: 12px;
      border: 1px solid rgba(148, 163, 184, 0.26);
      border-radius: 6px;
      background: rgba(12, 18, 28, 0.88);
      backdrop-filter: blur(8px);
    }
    .title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
  <link rel="stylesheet" href="../example-fullscreen.css" />
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="panel">
    <div class="title">CSG Boolean Geometry</div>
    <div class="meta">
      <span id="operation">Subtract</span>
      <span id="triangles">0 triangles</span>
    </div>
  </div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
