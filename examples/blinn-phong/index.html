<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海月 – Blinn-Phong Lighting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050508;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }
    canvas { display: block; }

    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .section-label {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      padding: 2px 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    button {
      font-family: monospace;
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 5px;
      background: rgba(0,0,0,0.5);
      color: rgba(255,255,255,0.65);
      cursor: pointer;
      width: 210px;
      text-align: left;
      transition: background 0.12s;
    }
    button:hover { background: rgba(255,255,255,0.08); }
    button.active {
      background: rgba(80,160,255,0.22);
      border-color: rgba(80,160,255,0.55);
      color: #fff;
    }
    #hint {
      position: absolute;
      bottom: 12px;
      font-size: 11px;
      color: rgba(255,255,255,0.22);
      font-family: monospace;
      text-align: center;
    }
  </style>
  <link rel="stylesheet" href="../example-fullscreen.css" />
</head>
<body>
  <canvas id="canvas" width="900" height="600"></canvas>

  <div id="ui">
    <div class="section-label">Lights</div>
    <button id="btn-ambient"  class="active">A · Ambient light</button>
    <button id="btn-dir"      class="active">D · Directional (sun)</button>
    <button id="btn-point"    class="active">P · Point light (orbit)</button>

    <div class="section-label" style="margin-top:6px">Shininess</div>
    <button id="btn-sh-lo">S · Low  (8)</button>
    <button id="btn-sh-md">S · Med  (64)</button>
    <button id="btn-sh-hi">S · High (256)</button>
  </div>

  <div id="hint">
    A/D/P = toggle lights &nbsp;·&nbsp; S = shininess &nbsp;·&nbsp; left drag = orbit &nbsp;·&nbsp; scroll = zoom
  </div>

  <script src="../shared/engine.js"></script>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
