<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>海月 · Ambient Occlusion</title>
  <link rel="stylesheet" href="../example-fullscreen.css" />
  <style>
    body { margin: 0; overflow: hidden; color: #eef8ff; background: #050812; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .panel { position: fixed; top: 20px; left: 20px; width: min(350px, calc(100vw - 40px)); padding: 18px 20px; border: 1px solid #57eadc3d; border-radius: 12px; background: #07111ee8; box-shadow: 0 22px 70px #0009; backdrop-filter: blur(14px); }
    .eyebrow { margin: 0 0 4px; color: #57eadc; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font: 650 22px/1.2 system-ui, sans-serif; letter-spacing: -.02em; }
    .description { margin: 8px 0 16px; color: #9cafc4; }
    .control { display: grid; grid-template-columns: 88px 1fr 44px; align-items: center; gap: 9px; margin: 9px 0; }
    .toggle { grid-template-columns: auto 1fr auto; }
    select { min-width: 0; padding: 5px 7px; border: 1px solid #57eadc55; border-radius: 5px; color: #eefcff; background: #0a1a29; }
    input { accent-color: #57eadc; }
    input[type="range"] { width: 100%; }
    output { color: #57eadc; text-align: right; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 15px; overflow: hidden; border: 1px solid #57eadc26; border-radius: 7px; background: #57eadc26; }
    .metric { padding: 8px; background: #07111e; }
    .metric span { display: block; color: #7f94aa; font-size: 8px; text-transform: uppercase; }
    .metric strong { display: block; margin-top: 3px; color: #fff; }
    .hint { position: fixed; right: 18px; bottom: 15px; color: #91a8bd88; font-size: 10px; }
    #result { display: none; }
  </style>
</head>
<body data-render-status="pending">
  <canvas id="canvas" width="1200" height="760"></canvas>
  <section class="panel">
    <p class="eyebrow">Depth + view-normal postprocess</p>
    <h1>环境光遮蔽 · AO</h1>
    <p class="description">同一场景即时切换 GTAO、SAO 与 SSAO。墙角、接触面、叠放方块和悬垂结构用于观察不同算法的遮蔽范围与稳定性。</p>
    <label class="control toggle"><input id="enabled" type="checkbox" checked /><span>启用 AO</span><output></output></label>
    <label class="control"><span>算法</span><select id="algorithm"><option value="gtao">GTAO</option><option value="sao">SAO</option><option value="ssao">SSAO</option></select><output></output></label>
    <label class="control"><span>显示</span><select id="display"><option value="composite">Composite</option><option value="occlusion">AO only</option></select><output></output></label>
    <label class="control"><span>质量</span><select id="quality"><option value="low">Low · 8</option><option value="medium">Medium · 16</option><option value="high" selected>High · 32</option></select><output></output></label>
    <label class="control"><span>半径</span><input id="radius" type="range" min="0.1" max="4" step="0.05" value="1.5" /><output id="radius-value">1.50u</output></label>
    <label class="control"><span>强度</span><input id="intensity" type="range" min="0" max="3" step="0.05" value="1.45" /><output id="intensity-value">1.45</output></label>
    <div class="metrics">
      <div class="metric"><span>Algorithm</span><strong id="active-algorithm">GTAO</strong></div>
      <div class="metric"><span>Samples</span><strong id="sample-count">32</strong></div>
      <div class="metric"><span>Frames</span><strong id="frame-count">0</strong></div>
    </div>
  </section>
  <div class="hint">拖拽旋转 · 滚轮缩放 · 切换算法/纯 AO 查看差异</div>
  <pre id="result" aria-hidden="true"></pre>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
