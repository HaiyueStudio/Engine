name: Engine Planar Diagnostic

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      content_tier:
        description: Content manifest tier to build
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: ci-slow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow-gate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: profile-x64, runner: ubuntu-latest, mode: profile, platform: linux64 }
          - { name: replay-x64, runner: ubuntu-latest, mode: replay, platform: linux64 }
          - { name: replay-arm64, runner: ubuntu-24.04-arm, mode: replay, platform: linux-arm64 }
    timeout-minutes: 60
    env:
      BENCHMARK_PROFILE: ci
      CPU_BENCHMARK_RUNNER_PROFILE: github-hosted-ubuntu-latest
      CONTENT_TIER: ${{ github.event_name == 'schedule' && 'full' || (github.event_name == 'workflow_dispatch' && inputs.content_tier || 'smoke') }}
      WEBGPU_ANGLE_BACKEND: swiftshader
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision the same pinned official browser on both architectures
        if: matrix.mode == 'replay'
        env:
          CFT_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version=157.0.8103.15
          browser_dir="$RUNNER_TEMP/planar-browser"
          mkdir -p "$browser_dir" artifacts/planar-ci-diagnostic
          curl --fail --silent --show-error --location --retry 2 "https://storage.googleapis.com/chrome-for-testing-public/$version/$CFT_PLATFORM/chrome-$CFT_PLATFORM.zip" --output "$browser_dir/browser.zip"
          sha256sum "$browser_dir/browser.zip" | cut -d " " -f 1 > artifacts/planar-ci-diagnostic/browser-sha256.txt
          unzip -q "$browser_dir/browser.zip" -d "$browser_dir"
          browser="$browser_dir/chrome-$CFT_PLATFORM/chrome"
          "$browser" --version
          printf "CHROME_PATH=%s\nWEBGPU_RECORD_PERFORMANCE_EVIDENCE=0\n" "$browser" >> "$GITHUB_ENV"
      - name: Build Engine foundations and diagnostic inputs
        run: node scripts/release-ci-bootstrap.mjs

      - name: Profile original SwiftShader workload (diagnostic only)
        if: matrix.mode == 'profile'
        run: |
          set -euo pipefail
          mkdir -p artifacts/planar-ci-diagnostic
          node -e 'console.log(JSON.stringify({cpu:require("node:os").cpus()[0]?.model,threads:require("node:os").availableParallelism(),node:process.version,revision:process.env.GITHUB_SHA}))' > artifacts/planar-ci-diagnostic/runner.json
          cat > artifacts/planar-ci-diagnostic/profile.html <<'HAIYUE_FIXTURE'
          <!doctype html><meta charset="utf-8"><script type="importmap">{"imports":{"wgpu-matrix":"/node_modules/wgpu-matrix/dist/3.x/wgpu-matrix.module.js"}}</script><pre id="result"></pre><script type="module" src="./profile.mjs"></script>
          HAIYUE_FIXTURE
          cat > artifacts/planar-ci-diagnostic/profile.mjs <<'HAIYUE_FIXTURE'
          import {createRealRendererBenchmarkScenario, destroyRealRendererBenchmarkScenario, warmRealRendererBenchmarkPipelines, runRealRendererBenchmarkFrame, resetRealRendererBenchmarkMetrics, getRealRendererBenchmarkMetrics} from '/scripts/benchmark/real-renderer-scenario.mjs';
          import {RealRendererGpuTimestampProbe} from '/scripts/benchmark/real-renderer-gpu-timestamp.mjs';
          const node=document.querySelector('#result');
          const runs=[];
          try {
           for(const [mirrorCount,maxBounces,viewCount] of [[0,1,1],[4,5,1],[4,8,4]]){
            const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});
            if(!adapter||adapter.info.architecture!=='swiftshader')throw Error('Need real SwiftShader: '+JSON.stringify(adapter?{vendor:adapter.info.vendor,architecture:adapter.info.architecture}:null));
            const timestamp=adapter.features.has('timestamp-query');
            const device=await adapter.requestDevice({requiredFeatures:timestamp?['timestamp-query']:[]});
            device.pushErrorScope('validation');
            let state,probe,variant='full';
            let passes=[];
            const create=device.createCommandEncoder.bind(device);
            device.createCommandEncoder=(...args)=>{
             const encoder=create(...args),begin=encoder.beginRenderPass.bind(encoder);
             encoder.beginRenderPass=descriptor=>{
              const pass=begin(descriptor),setScissor=pass.setScissorRect.bind(pass);
              passes.push(descriptor.label??'(unlabelled)');
              if(variant==='scissor-1px'){setScissor(0,0,1,1);pass.setScissorRect=()=>setScissor(0,0,1,1);}
              return pass;
             };
             return encoder;
            };
            try{
             state=await createRealRendererBenchmarkScenario({device,entityCount:10000,mirrorCount,maxBounces,viewCount,dynamicRatio:.1,mirrorWidth:32,mirrorHeight:32,mirrorVisibilityCulling:false});
             const start=performance.now();
             await warmRealRendererBenchmarkPipelines(state);
             const warmMs=performance.now()-start,frames=[];
             for(let i=0;i<3;i++)await runRealRendererBenchmarkFrame(state);
             resetRealRendererBenchmarkMetrics(state);
             probe=new RealRendererGpuTimestampProbe(device,{includeCompute:true});
             for(const next of ['full','scissor-1px','scissor-1px','full']){
              variant=next;passes=[];
              await runRealRendererBenchmarkFrame(state,{gpuTimestampProbe:probe});
              frames.push({variant,passes,...state.lastFrameTiming});
              console.info('PROFILE '+JSON.stringify({mirrorCount,maxBounces,viewCount,variant,queueWaitMs:state.lastFrameTiming.queueWaitMs,cpuRecordMs:state.lastFrameTiming.cpuRecordMs,sampleWallMs:state.lastFrameTiming.sampleWallMs,gpu:state.lastFrameTiming.gpuTimestamp}));
             }
             const metrics=getRealRendererBenchmarkMetrics(state);
             runs.push({mirrorCount,maxBounces,viewCount,warmMs,timestamp,frames,metrics});
            } finally {
             probe?.destroy();if(state)await destroyRealRendererBenchmarkScenario(state);
             const error=await device.popErrorScope();device.destroy();if(error)throw error;
            }
           }
           node.textContent=JSON.stringify({status:'passed',adapter:'swiftshader',role:'diagnostic-only',runs});node.dataset.status='passed';
          } catch(error){node.textContent=JSON.stringify({status:'failed',error:String(error.stack??error),runs});node.dataset.status='failed';}
          HAIYUE_FIXTURE
          node --input-type=module <<'HAIYUE_NODE'
          import {runChromeWebGpuFixture} from './scripts/webgpu-gate/chrome-runner.mjs';
          import {writeFileSync} from 'node:fs';
          const result=await runChromeWebGpuFixture({root:process.cwd(),fixture:'artifacts/planar-ci-diagnostic/profile.html',timeoutMs:240000,interact:async cdp=>cdp.on('Runtime.consoleAPICalled',event=>{const line=event.args?.[0]?.value;if(typeof line==='string'&&line.startsWith('PROFILE '))console.log(line);})});
          writeFileSync('artifacts/planar-ci-diagnostic/result.json',JSON.stringify(result,null,2));
          HAIYUE_NODE
      - name: Run the unchanged planar gate with its original deadline
        if: matrix.mode == 'replay'
        run: |
          uname -m
          lscpu | grep -E "Model name|^CPU\(s\)"
          npm run verify:planar-reflection
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: planar-ci-${{ matrix.name }}
          path: |
            artifacts/planar-ci-diagnostic/
            artifacts/webgpu/planar-reflection*.json
