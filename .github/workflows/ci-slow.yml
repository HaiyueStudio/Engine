name: CI Slow

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      content_tier:
        description: Content manifest tier to build
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: ci-slow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BENCHMARK_PROFILE: ci
      CPU_BENCHMARK_RUNNER_PROFILE: github-hosted-ubuntu-latest
      CONTENT_TIER: ${{ github.event_name == 'schedule' && 'full' || (github.event_name == 'workflow_dispatch' && inputs.content_tier || 'smoke') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run slow quality gate
        run: npm run check:slow -- --content-tier="${CONTENT_TIER}"

      - name: Upload slow-gate reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: slow-gate-${{ env.CONTENT_TIER }}-reports
          path: |
            artifacts/benchmarks/*.json
            artifacts/editor-e2e/*
            artifacts/webgpu/*.json
          if-no-files-found: warn
          retention-days: 30
