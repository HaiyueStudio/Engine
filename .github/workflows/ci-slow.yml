name: Engine SwiftShader planar retest

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      content_tier:
        description: Content manifest tier to build
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: ci-planar-occlusion-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BENCHMARK_PROFILE: ci
      CPU_BENCHMARK_RUNNER_PROFILE: github-hosted-ubuntu-latest
      CONTENT_TIER: ${{ github.event_name == 'schedule' && 'full' || (github.event_name == 'workflow_dispatch' && inputs.content_tier || 'smoke') }}
      WEBGPU_ANGLE_BACKEND: swiftshader
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the unchanged planar-reflection gate
        env:
          HAIYUE_BENCHMARK_SCOPE: engine
        run: |
          set -euo pipefail
          uname -m
          lscpu | grep -E 'Model name|^CPU\(s\)'
          google-chrome --version
          npm run verify:planar-reflection

      - name: Upload unchanged gate results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: planar-occlusion-gate
          path: artifacts/webgpu/planar-reflection*.json
