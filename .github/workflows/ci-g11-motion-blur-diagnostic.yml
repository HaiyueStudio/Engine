name: G11 Motion Blur Diagnosis

on:
  push:
    branches: [codex/g11-motion-blur-diagnostic-7236b395]

permissions:
  contents: read

jobs:
  motion-blur-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      WEBGPU_ANGLE_BACKEND: swiftshader
      BENCHMARK_PROFILE: ci
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 5
          persist-credentials: false
      - name: Confirm the motion blur fix scope
        shell: bash
        run: |
          set -eu
          base=7236b3953b42047bf2b9f45485fc29393f51f39b
          git merge-base --is-ancestor "$base" HEAD
          output=artifacts/g11-motion-blur-diagnosis
          mkdir -p "$output"
          printf '%s\n' \
            '.github/workflows/ci-g11-motion-blur-diagnostic.yml' \
            'examples/motion-blur/main.ts' \
            'examples/motion-blur/regression-capture.ts' \
            'scripts/verify-motion-blur-example.mjs' > "$output/expected-paths.txt"
          git diff --name-only "$base" HEAD | sort | diff - "$output/expected-paths.txt"
          git rev-parse HEAD > "$output/head-revision.txt"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install and build the example
        shell: bash
        run: |
          set -eu
          npm ci
          node scripts/release-ci-bootstrap.mjs
          npm run build:target -- example:motion-blur
      - name: Run the original pixel assertions on the offscreen capture
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/g11-motion-blur-diagnosis
          {
            uname -a
            lscpu
            node --version
            google-chrome --version
            sha256sum scripts/verify-motion-blur-example.mjs examples/motion-blur/bundle.js examples/shared/engine.js
          } > "$output/environment.txt"
          node --test scripts/webgpu-gate/motion-blur-gate-policy.test.mjs | tee "$output/policy.log"
          node scripts/verify-motion-blur-example.mjs 2>&1 | tee "$output/offscreen-gate.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: motion-blur-ubuntu-diagnosis
          path: artifacts/g11-motion-blur-diagnosis/
          if-no-files-found: error
