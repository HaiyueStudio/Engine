name: Deploy GitHub Pages (CI)

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: github-pages-ci
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build foundations (shader-language, engine, animation-spec, extensions)
        run: node scripts/release-ci-bootstrap.mjs --pages-examples

      - name: Build and validate examples catalog
        run: |
          npm run build:examples
          npm run examples:catalog:check

      - name: Assemble examples site
        env:
          PAGES_OUTPUT_ROOT: ${{ github.workspace }}/artifacts/pages-release
        run: node scripts/assemble-pages-release.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/pages-release

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@decdde0ac072f6db7b846693aeb66d213a3b5175 # v4
