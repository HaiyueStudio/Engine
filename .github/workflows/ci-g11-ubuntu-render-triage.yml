name: G11 Ubuntu Presentation Matrix

on:
  push:
    branches: [codex/g11-motion-blur-diagnostic-7236b395]

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [graphite-swift, graphite-vulkan, graphite-compound, x11-gl, x11-vulkan, x11-graphite, headless-angle-vulkan, headless-interop, angle-gles, chrome-shell]
    env:
      BENCHMARK_PROFILE: ci
      WEBGPU_ANGLE_BACKEND: swiftshader
      BROWSER_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node scripts/release-ci-bootstrap.mjs
      - run: npm run build:target -- example:ambient-occlusion example:clipping-planes
      - name: Run the unchanged AO and clipping gates
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/artifacts/g11-ubuntu-presentation-matrix"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/revision.txt"
          export BROWSER_BIN=/usr/bin/google-chrome
          if [[ "$BROWSER_PROFILE" == x11-* ]]; then
            export DISPLAY=:89
            Xvfb "$DISPLAY" -ac -screen 0 1920x1080x24 -nolisten tcp > "$out/xvfb.log" 2>&1 &
            xserver=$!
            trap 'kill "$xserver" 2>/dev/null || true' EXIT
            for i in {1..50}; do
              if [[ -S /tmp/.X11-unix/X89 ]]; then break; fi
              kill -0 "$xserver"
              sleep 0.2
            done
            test -S /tmp/.X11-unix/X89
          elif [[ "$BROWSER_PROFILE" == chrome-shell ]]; then
            metadata='https://googlechromelabs.github.io/chrome-for-testing/latest-versions-per-milestone-with-downloads.json'
            url=$(curl -fsSL --retry 3 "$metadata" | jq -er '.milestones["156"].downloads["chrome-headless-shell"][] | select(.platform == "linux64") | .url')
            printf '%s\n' "$url" > "$out/download-url.txt"
            curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/cft.zip"
            sha256sum "$RUNNER_TEMP/cft.zip" > "$out/download-sha256.txt"
            unzip -q "$RUNNER_TEMP/cft.zip" -d "$RUNNER_TEMP/cft"
            BROWSER_BIN="$RUNNER_TEMP/cft/chrome-headless-shell-linux64/chrome-headless-shell"
          fi
          "$BROWSER_BIN" --version > "$out/chrome.txt"
          cat > "$out/chrome-capture" <<'CHROME'
          #!/usr/bin/env bash
          set -eu
          args=()
          for arg in "$@"; do
            if [[ "$arg" == --use-angle=* ]]; then continue; fi
            if [[ "$BROWSER_PROFILE" == x11-* && "$arg" == --headless* ]]; then continue; fi
            args+=("$arg")
          done
          args+=(--enable-unsafe-swiftshader --use-gl=angle --ignore-gpu-blocklist)
          graphite=(--enable-skia-graphite --skia-graphite-dawn-backend=swiftshader --use-webgpu-adapter=swiftshader)
          vulkan=(--enable-features=Vulkan --use-vulkan=swiftshader --use-webgpu-adapter=swiftshader)
          case "$BROWSER_PROFILE" in
            graphite-swift) args+=(--use-angle=swiftshader "${graphite[@]}") ;;
            graphite-vulkan) args+=(--use-angle=swiftshader --enable-skia-graphite --skia-graphite-dawn-backend=vulkan "${vulkan[@]}" --disable-vulkan-surface) ;;
            graphite-compound) args+=(--use-angle=swiftshader "${graphite[@]}" --enable-features=CompoundSharedImageBacking) ;;
            x11-gl) args+=(--ozone-platform=x11 --use-angle=swiftshader --disable-skia-graphite --use-webgpu-adapter=swiftshader) ;;
            x11-vulkan) args+=(--ozone-platform=x11 --use-angle=swiftshader "${vulkan[@]}") ;;
            x11-graphite) args+=(--ozone-platform=x11 --use-angle=swiftshader "${graphite[@]}") ;;
            headless-angle-vulkan) args+=(--use-angle=vulkan --enable-features=Vulkan,VulkanFromANGLE --use-vulkan=swiftshader --use-webgpu-adapter=swiftshader --disable-vulkan-surface) ;;
            headless-interop) args+=(--use-angle=gl --use-vulkan=swiftshader --use-webgpu-adapter=swiftshader --enable-features=Vulkan,WebGPUOnVulkanViaGLInterop --disable-vulkan-surface) ;;
            angle-gles) args+=(--use-angle=swiftshader --use-webgpu-adapter=opengles --disable-skia-graphite) ;;
            chrome-shell) args+=(--use-angle=swiftshader --enable-gpu "${graphite[@]}") ;;
          esac
          printf '%q ' "$BROWSER_BIN" "${args[@]}" >> "$CHROME_DIAGNOSTIC_FILE"
          printf '\n' >> "$CHROME_DIAGNOSTIC_FILE"
          exec "$BROWSER_BIN" "${args[@]}" 2> >(tee -a "$CHROME_DIAGNOSTIC_FILE" >&2)
          CHROME
          chmod +x "$out/chrome-capture"
          export CHROME_PATH="$out/chrome-capture"
          run_gate() {
            local name="$1"; shift
            export CHROME_DIAGNOSTIC_FILE="$out/$name-browser.log"
            local status=0
            node "$@" 2>&1 | tee "$out/$name-gate.log" || status=$?
            printf '%s=%s\n' "$name" "$status" | tee -a "$out/status.txt"
            if [ "$status" != 0 ]; then failed=1; fi
          }
          failed=0
          run_gate ao scripts/verify-ambient-occlusion-example.mjs
          run_gate clipping scripts/verify-clipping-planes-example.mjs
          run_gate pixels scripts/verify-pixel-regression.mjs
          run_gate product-pixels scripts/verify-pixel-regression.mjs --product
          exit "$failed"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ubuntu-presentation-matrix-${{ matrix.profile }}
          path: artifacts/g11-ubuntu-presentation-matrix/
          if-no-files-found: warn
