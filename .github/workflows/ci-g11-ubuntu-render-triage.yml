name: G11 Ubuntu PBR Font Verification

on:
  push:
    branches: [codex/g11-motion-blur-diagnostic-7236b395]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCHMARK_PROFILE: ci
      WEBGPU_ANGLE_BACKEND: swiftshader
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install CJK fonts for the unchanged full-page references
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
      - run: node scripts/release-ci-bootstrap.mjs
      - run: npm run build:target -- example:pbr-showcase
      - name: Verify every original PBR mode and control
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/artifacts/g11-ubuntu-pbr-font"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/revision.txt"
          google-chrome --version > "$out/chrome.txt"
          dpkg-query --show fonts-noto-cjk > "$out/fonts-package.txt"
          fc-match monospace > "$out/fonts.txt"
          fc-match sans-serif >> "$out/fonts.txt"
          fc-match ':lang=zh-cn' >> "$out/fonts.txt"
          node scripts/verify-pbr-example.mjs 2>&1 | tee "$out/pbr-gate.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ubuntu-pbr-font
          path: |
            artifacts/g11-ubuntu-pbr-font/
            artifacts/render-regression/pbr/
          if-no-files-found: warn
