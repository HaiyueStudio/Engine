name: G11 Ubuntu Capture Verification

on:
  push:
    branches: [codex/g11-motion-blur-diagnostic-7236b395]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [fixed-texture, x11-original, x11-vulkan, x11-vulkan-surface, x11-graphite]
    env:
      BENCHMARK_PROFILE: ci
      WEBGPU_ANGLE_BACKEND: swiftshader
      BROWSER_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - if: matrix.profile != 'fixed-texture'
        run: node scripts/release-ci-bootstrap.mjs
      - if: matrix.profile != 'fixed-texture'
        run: npm run build:target -- example:ambient-occlusion example:clipping-planes
      - name: Verify fixed texture readback directly
        if: matrix.profile == 'fixed-texture'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/g11-ubuntu-capture
          git rev-parse HEAD > artifacts/g11-ubuntu-capture/revision.txt
          google-chrome --version > artifacts/g11-ubuntu-capture/chrome.txt
          node scripts/verify-pixel-regression.mjs 2>&1 | tee artifacts/g11-ubuntu-capture/pixels-gate.log
          node scripts/verify-pixel-regression.mjs --product 2>&1 | tee artifacts/g11-ubuntu-capture/product-pixels-gate.log
          cp artifacts/render-regression/*-candidate.json artifacts/g11-ubuntu-capture/
      - name: Verify the original screenshot gates on a virtual display
        if: matrix.profile != 'fixed-texture'
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/artifacts/g11-ubuntu-capture"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/revision.txt"
          google-chrome --version > "$out/chrome.txt"
          export DISPLAY=:89
          Xvfb "$DISPLAY" -ac -screen 0 1920x1080x24 -nolisten tcp > "$out/xvfb.log" 2>&1 &
          xserver=$!
          trap 'kill "$xserver" 2>/dev/null || true' EXIT
          for i in {1..50}; do
            if [[ -S /tmp/.X11-unix/X89 ]]; then break; fi
            kill -0 "$xserver"
            sleep 0.2
          done
          test -S /tmp/.X11-unix/X89
          cat > "$out/chrome-capture" <<'CHROME'
          #!/usr/bin/env bash
          set -eu
          args=()
          for arg in "$@"; do
            if [[ "$arg" != --headless* ]]; then args+=("$arg"); fi
          done
          args+=(--ozone-platform=x11 --no-first-run --no-default-browser-check --disable-search-engine-choice-screen)
          vulkan=(--enable-features=Vulkan --use-vulkan=swiftshader --use-webgpu-adapter=swiftshader)
          case "$BROWSER_PROFILE" in
            x11-vulkan) args+=("${vulkan[@]}" --disable-vulkan-surface) ;;
            x11-vulkan-surface) args+=("${vulkan[@]}") ;;
            x11-graphite) args+=(--enable-skia-graphite --skia-graphite-dawn-backend=swiftshader --use-webgpu-adapter=swiftshader) ;;
          esac
          printf '%q ' /usr/bin/google-chrome "${args[@]}" >> "$CHROME_DIAGNOSTIC_FILE"
          printf '\n' >> "$CHROME_DIAGNOSTIC_FILE"
          exec /usr/bin/google-chrome "${args[@]}" 2> >(tee -a "$CHROME_DIAGNOSTIC_FILE" >&2)
          CHROME
          chmod +x "$out/chrome-capture"
          export CHROME_PATH="$out/chrome-capture"
          run_gate() {
            local name="$1"; shift
            export CHROME_DIAGNOSTIC_FILE="$out/$name-browser.log"
            local status=0
            node "$@" 2>&1 | tee "$out/$name-gate.log" || status=$?
            printf '%s=%s\n' "$name" "$status" | tee -a "$out/status.txt"
            if [ "$status" != 0 ]; then failed=1; fi
          }
          failed=0
          run_gate ao scripts/verify-ambient-occlusion-example.mjs
          run_gate clipping scripts/verify-clipping-planes-example.mjs
          exit "$failed"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ubuntu-capture-${{ matrix.profile }}
          path: artifacts/g11-ubuntu-capture/
          if-no-files-found: warn
