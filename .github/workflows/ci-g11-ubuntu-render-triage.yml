name: G11 Ubuntu Browser Matrix

on:
  push:
    branches: [codex/g11-motion-blur-diagnostic-7236b395]

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [headless-cpu, headless-gl, headed-gl, headed-vulkan, headed-vulkan-surface, headless-graphite, cft-155, cft-150, cft-beta]
    env:
      BENCHMARK_PROFILE: ci
      WEBGPU_ANGLE_BACKEND: swiftshader
      BROWSER_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node scripts/release-ci-bootstrap.mjs
      - run: npm run build:target -- example:ambient-occlusion example:clipping-planes
      - name: Test original screenshot and WebGPU readback gates
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/artifacts/g11-ubuntu-browser-matrix"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/revision.txt"
          export BROWSER_BIN=/usr/bin/google-chrome
          if [[ "$BROWSER_PROFILE" == cft-* ]]; then
            if [[ "$BROWSER_PROFILE" == cft-beta ]]; then
              metadata='https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json'
              url=$(curl -fsSL --retry 3 "$metadata" | jq -er '.channels.Beta.downloads.chrome[] | select(.platform == "linux64") | .url')
            else
              metadata='https://googlechromelabs.github.io/chrome-for-testing/latest-versions-per-milestone-with-downloads.json'
              url=$(curl -fsSL --retry 3 "$metadata" | jq -er --arg major "${BROWSER_PROFILE#cft-}" '.milestones[$major].downloads.chrome[] | select(.platform == "linux64") | .url')
            fi
            printf '%s\n' "$url" > "$out/download-url.txt"
            curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/cft.zip"
            sha256sum "$RUNNER_TEMP/cft.zip" > "$out/download-sha256.txt"
            unzip -q "$RUNNER_TEMP/cft.zip" -d "$RUNNER_TEMP/cft"
            BROWSER_BIN="$RUNNER_TEMP/cft/chrome-linux64/chrome"
          fi
          "$BROWSER_BIN" --version > "$out/chrome.txt"
          cat > "$out/chrome-capture" <<'CHROME'
          #!/usr/bin/env bash
          set -eu
          args=("$@")
          chromium=( "$BROWSER_BIN" )
          if [[ "$BROWSER_PROFILE" == headed-* ]]; then
            args=()
            for arg in "$@"; do
              if [[ "$arg" != --headless* ]]; then args+=("$arg"); fi
            done
            chromium=( xvfb-run -a -s "-screen 0 1920x1080x24" "$BROWSER_BIN" )
          fi
          args+=(--enable-unsafe-swiftshader --use-gl=angle)
          case "$BROWSER_PROFILE" in
            headless-cpu) args+=(--disable-gpu-compositing --use-webgpu-adapter=swiftshader) ;;
            headless-gl|headed-gl) args+=(--disable-features=SkiaGraphite --use-webgpu-adapter=swiftshader) ;;
            headed-vulkan) args+=(--enable-features=Vulkan --use-vulkan=swiftshader --use-webgpu-adapter=swiftshader --disable-vulkan-surface --disable-features=SkiaGraphite) ;;
            headed-vulkan-surface) args+=(--enable-features=Vulkan --use-vulkan=swiftshader --use-webgpu-adapter=swiftshader --disable-features=SkiaGraphite) ;;
            headless-graphite) args+=(--enable-features=Vulkan,SkiaGraphite --use-vulkan=swiftshader --use-webgpu-adapter=swiftshader --disable-vulkan-surface) ;;
          esac
          printf '%q ' "${chromium[@]}" "${args[@]}" >> "$CHROME_DIAGNOSTIC_FILE"
          printf '\n' >> "$CHROME_DIAGNOSTIC_FILE"
          exec "${chromium[@]}" "${args[@]}" 2> >(tee -a "$CHROME_DIAGNOSTIC_FILE" >&2)
          CHROME
          chmod +x "$out/chrome-capture"
          export CHROME_PATH="$out/chrome-capture"
          run_gate() {
            local name="$1"; shift
            export CHROME_DIAGNOSTIC_FILE="$out/$name-browser.log"
            local status=0
            node "$@" 2>&1 | tee "$out/$name-gate.log" || status=$?
            printf '%s=%s\n' "$name" "$status" | tee -a "$out/status.txt"
            if [ "$status" != 0 ]; then failed=1; fi
          }
          failed=0
          run_gate ao scripts/verify-ambient-occlusion-example.mjs
          run_gate clipping scripts/verify-clipping-planes-example.mjs
          run_gate pixels scripts/verify-pixel-regression.mjs
          run_gate product-pixels scripts/verify-pixel-regression.mjs --product
          exit "$failed"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ubuntu-browser-matrix-${{ matrix.profile }}
          path: artifacts/g11-ubuntu-browser-matrix/
          if-no-files-found: warn
