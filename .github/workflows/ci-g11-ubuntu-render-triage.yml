name: G11 Ubuntu PBR Font Metrics

on:
  push:
    branches: [codex/g11-motion-blur-diagnostic-7236b395]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        font: [liberation-ui, liberation-all, noto-ui]
    env:
      BENCHMARK_PROFILE: ci
      WEBGPU_ANGLE_BACKEND: swiftshader
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install and record screenshot fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk fonts-noto-core fonts-liberation
          out="$PWD/artifacts/g11-ubuntu-pbr-font-metrics"
          mkdir -p "$out" "$HOME/.config/fontconfig/conf.d"
          ui='Liberation Sans'
          mono='DejaVu Sans Mono'
          if [ "$FONT" = liberation-all ]; then mono='Liberation Mono'; fi
          if [ "$FONT" = noto-ui ]; then ui='Noto Sans'; fi
          cat > "$HOME/.config/fontconfig/conf.d/99-haiyue-screenshot.conf" <<FONTCONFIG
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias binding="strong"><family>system-ui</family><prefer><family>$ui</family></prefer></alias>
            <alias binding="strong"><family>ui-monospace</family><prefer><family>$mono</family></prefer></alias>
            <alias binding="strong"><family>monospace</family><prefer><family>$mono</family></prefer></alias>
          </fontconfig>
          FONTCONFIG
          fc-cache -f
          cp "$HOME/.config/fontconfig/conf.d/99-haiyue-screenshot.conf" "$out/fontconfig.conf"
          for family in system-ui ui-monospace monospace sans-serif ':lang=zh-cn'; do
            fc-match "$family" >> "$out/fonts.txt"
          done
          git rev-parse HEAD > "$out/revision.txt"
          google-chrome --version > "$out/chrome.txt"
          dpkg-query --show fonts-noto-cjk fonts-noto-core fonts-liberation > "$out/font-packages.txt"
        env:
          FONT: ${{ matrix.font }}
      - run: node scripts/release-ci-bootstrap.mjs
      - run: npm run build:target -- example:pbr-showcase
      - name: Verify original PBR references
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-pbr-example.mjs 2>&1 | tee artifacts/g11-ubuntu-pbr-font-metrics/pbr-gate.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ubuntu-pbr-font-metrics-${{ matrix.font }}
          path: |
            artifacts/g11-ubuntu-pbr-font-metrics/
            artifacts/render-regression/pbr/
          if-no-files-found: warn
