name: G11 Remaining Slow Verification

on:
  push:
    branches: [codex/g11-motion-blur-diagnostic-7236b395]

permissions:
  contents: read

jobs:
  remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BENCHMARK_PROFILE: ci
      CPU_BENCHMARK_RUNNER_PROFILE: github-hosted-ubuntu-latest
      WEBGPU_ANGLE_BACKEND: swiftshader
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node scripts/release-ci-bootstrap.mjs
      - name: Execute all remaining original full-content checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/g11-remaining-slow
          node --input-type=module <<'NODE' 2>&1 | tee artifacts/g11-remaining-slow/gate.log
          import {spawnSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          import {createContentTargetPlan,loadContentManifests} from './scripts/content-gate-policy.mjs';
          import {createEngineSlowChecks} from './scripts/engine-release-policy.mjs';
          const plan=createContentTargetPlan('full',loadContentManifests(process.cwd(),'engine'));
          const checks=createEngineSlowChecks(plan).slice(2);
          writeFileSync('artifacts/g11-remaining-slow/plan.json',JSON.stringify({diagnosticOnly:true,targets:plan.targets,checks},null,2)+'\n');
          for(const args of checks){
            console.log('[remaining-original-check] npm '+args.join(' '));
            const result=spawnSync('npm',args,{stdio:'inherit',env:{...process.env,HAIYUE_BENCHMARK_SCOPE:'engine'}});
            if(result.error)throw result.error;
            if(result.status!==0)process.exit(result.status??1);
          }
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: remaining-original-checks
          path: |
            artifacts/g11-remaining-slow/
            artifacts/benchmarks/
            artifacts/webgpu/
          if-no-files-found: warn
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEBGPU_ANGLE_BACKEND: swiftshader
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node scripts/release-ci-bootstrap.mjs
      - name: Check every original render build target in one batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/g11-batched-build
          node scripts/verify-render-regressions.mjs 2>&1 | tee artifacts/g11-batched-build/gate.log
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {selectEngineRenderTargets} from './scripts/engine-release-policy.mjs';
          import {verifyExampleBuildFreshness} from './examples/scripts/example-build-fingerprint.mjs';
          const demos=selectEngineRenderTargets(JSON.parse(readFileSync('examples/manifest.json','utf8'))).map(e=>e.id);
          const check=await verifyExampleBuildFreshness({targets:['shared-engine',...demos]});
          const files=['examples/shared/engine.js','examples/pbr-showcase/bundle.js'];
          const hashes=Object.fromEntries(files.map(file=>[file,createHash('sha256').update(readFileSync(file)).digest('hex')]));
          writeFileSync('artifacts/g11-batched-build/batch.json',JSON.stringify({check,targets:demos,hashes},null,2)+'\n');
          NODE
          npm run build:target -- example:pbr-showcase 2>&1 | tee artifacts/g11-batched-build/single.log
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const before=JSON.parse(readFileSync('artifacts/g11-batched-build/batch.json','utf8'));
          for(const [file,hash] of Object.entries(before.hashes))assert.equal(createHash('sha256').update(readFileSync(file)).digest('hex'),hash,file);
          writeFileSync('artifacts/g11-batched-build/equivalence.json',JSON.stringify({status:'passed',source:before.check,renderTargets:before.targets.length,hashes:before.hashes},null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: batched-render-build
          path: artifacts/g11-batched-build/
          if-no-files-found: warn
