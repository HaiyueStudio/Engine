name: G11 AO Timeout Evidence Capture

on:
  push:
    branches: [codex/g11-motion-blur-diagnostic-7236b395]

permissions:
  contents: read

jobs:
  capture-expected-timeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCHMARK_PROFILE: ci
      WEBGPU_ANGLE_BACKEND: swiftshader
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node scripts/release-ci-bootstrap.mjs
      - name: Verify retention of the original failed full matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/g11-ao-capture
          git rev-parse HEAD > artifacts/g11-ao-capture/revision.txt
          google-chrome --version > artifacts/g11-ao-capture/chrome.txt
          status=0
          node scripts/verify-ambient-occlusion-gpu-cost.mjs 2>&1 | tee artifacts/g11-ao-capture/gate.log || status=$?
          export ORIGINAL_GATE_EXIT_CODE="$status"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readdirSync,readFileSync,writeFileSync} from 'node:fs';
          if(process.env.ORIGINAL_GATE_EXIT_CODE==='0'){
            const result=JSON.parse(readFileSync('artifacts/webgpu/ambient-occlusion-gpu-cost.json','utf8'));
            assert.equal(result.artifactValidation.status,'passed');assert.equal(result.cases.length,18);
            const proof={status:'full-matrix-completed',qualification:false,originalGateStatus:'passed',originalGateExitCode:0,timeoutMs:600000,completedCases:18};
            writeFileSync('artifacts/g11-ao-capture/proof.json',JSON.stringify(proof,null,2)+'\n');
            console.log(JSON.stringify(proof));process.exit(0);
          }
          const files=readdirSync('artifacts/webgpu').filter(f=>/^ambient-occlusion-gpu-cost-failed-\d+\.json$/.test(f));
          assert.equal(process.env.ORIGINAL_GATE_EXIT_CODE,'1');
          assert.equal(files.length,1);
          const original=JSON.parse(readFileSync('artifacts/webgpu/'+files[0],'utf8'));
          const failure=original.browserFailure;
          const snapshot=failure.fixtureSnapshot;
          assert.match(original.error,/Timed out waiting for Chrome\/WebGPU fixture result/);
          assert.equal(original.mode,'full');assert.equal(original.warmup,8);assert.equal(original.samples,30);
          assert.equal(snapshot.configuration.caseCount,18);assert.equal(snapshot.configuration.timestampQuery,true);
          assert.equal(snapshot.adapter.architecture,'swiftshader');
          assert.deepEqual(snapshot.validationErrors,[]);assert.deepEqual(failure.browserErrors,[]);
          assert.equal(snapshot.deviceLost,null);
          for(const item of snapshot.cases)for(const phase of Object.values(item.gpu))assert.equal(phase.rawSamples.length,30);
          const proof={status:'failure-retention-verified',qualification:false,originalGateStatus:'failed',originalGateExitCode:1,timeoutMs:600000,completedCases:snapshot.cases.length,currentCase:snapshot.currentCase,webGpuErrors:0,browserErrors:0,rawFailureFile:'artifacts/webgpu/'+files[0]};
          writeFileSync('artifacts/g11-ao-capture/proof.json',JSON.stringify(proof,null,2)+'\n');
          console.log(JSON.stringify({retention:proof.status,qualification:false,completedCases:proof.completedCases,currentCase:proof.currentCase.id}));
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ao-full-timeout-evidence
          path: |
            artifacts/g11-ao-capture/
            artifacts/webgpu/ambient-occlusion-gpu-cost.json
            artifacts/webgpu/ambient-occlusion-gpu-cost-failed-*.json
          if-no-files-found: warn
