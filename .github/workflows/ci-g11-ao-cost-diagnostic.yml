name: G11 AO Cost Diagnostic

on:
  push:
    branches: [codex/g11-motion-blur-diagnostic-7236b395]

permissions:
  contents: read

jobs:
  ao-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [original, explicit-texture]
    env:
      BENCHMARK_PROFILE: ci
      WEBGPU_ANGLE_BACKEND: swiftshader
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node scripts/release-ci-bootstrap.mjs
      - name: Run the original 18-case AO cost matrix
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/artifacts/g11-ao-cost-diagnostic"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/revision.txt"
          google-chrome --version > "$out/chrome.txt"
          cat > "$out/chrome-capture" <<'CHROME'
          #!/usr/bin/env bash
          args=("$@")
          if [ "$AO_PROFILE" = explicit-texture ]; then
            args+=(--use-angle=vulkan --use-gl=angle --enable-unsafe-swiftshader --disable-gpu-compositing --use-webgpu-adapter=swiftshader)
          fi
          printf '%q ' /usr/bin/google-chrome "${args[@]}" >> "$AO_BROWSER_LOG"
          printf '\n' >> "$AO_BROWSER_LOG"
          exec /usr/bin/google-chrome "${args[@]}" 2> >(tee -a "$AO_BROWSER_LOG" >&2)
          CHROME
          chmod +x "$out/chrome-capture"
          export CHROME_PATH="$out/chrome-capture"
          export AO_BROWSER_LOG="$out/browser.log"
          node scripts/verify-ambient-occlusion-gpu-cost.mjs 2>&1 | tee "$out/gate.log"
        env:
          AO_PROFILE: ${{ matrix.profile }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ao-cost-${{ matrix.profile }}
          path: |
            artifacts/g11-ao-cost-diagnostic/
            artifacts/webgpu/ambient-occlusion-gpu-cost.json
          if-no-files-found: warn
