<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HaiYue cross-engine performance comparison</title>
  <style>
    html, body { margin: 0; background: #07101d; color: #dce9ff; font: 14px/1.5 system-ui, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px; }
    canvas { width: 640px; height: 360px; max-width: 100%; border: 1px solid #294260; }
    pre { white-space: pre-wrap; word-break: break-word; }
    #result { display: none; }
    html[data-visual-only="true"], html[data-visual-only="true"] body { width: 100%; height: 100%; overflow: hidden; }
    html[data-visual-only="true"] main { width: 100%; height: 100%; max-width: none; padding: 0; }
    html[data-visual-only="true"] h1, html[data-visual-only="true"] p, html[data-visual-only="true"] pre { display: none; }
    html[data-visual-only="true"] #viewport, html[data-visual-only="true"] canvas { width: 100%; height: 100%; border: 0; display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "wgpu-matrix": "/node_modules/wgpu-matrix/dist/3.x/wgpu-matrix.module.js",
        "@galacean/engine": "/node_modules/@galacean/engine/dist/module.js",
        "@galacean/engine-core": "/node_modules/@galacean/engine-core/dist/module.js",
        "@galacean/engine-loader": "/node_modules/@galacean/engine-loader/dist/module.js",
        "@galacean/engine-math": "/node_modules/@galacean/engine-math/dist/module.js",
        "@galacean/engine-rhi-webgl": "/node_modules/@galacean/engine-rhi-webgl/dist/module.js"
      }
    }
  </script>
</head>
<body>
  <main>
    <h1>HaiYue cross-engine performance comparison</h1>
    <p id="progress">starting</p>
    <section id="viewport"></section>
    <pre id="summary"></pre>
    <pre id="result" data-status=""></pre>
  </main>
  <script type="module" src="./runner.mjs"></script>
</body>
</html>
